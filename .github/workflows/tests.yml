name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  fast-tests:
    name: Fast tests (CPU torch, no model download)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch + project (editable)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel (~150 MB) — keeps CI fast.
          # All other deps (transformers, qwen-asr, faster-whisper, ctranslate2,
          # silero-vad, pydub, soundfile, librosa, opencc) come transitively via
          # the project's `dependencies` list in pyproject.toml.
          pip install torch torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[eval,dev]"

      - name: Run @fast tests
        run: pytest -m fast

      - name: Run @breeze_invariant contract suite
        run: pytest -m breeze_invariant

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ || echo "::warning::ruff issues (non-blocking)"
